name: Daily Update

on:
  # 仅由 Cloudflare Worker 触发（每天北京时间 17:00 秒级调用 workflow_dispatch），也可手动触发
  # 已移除 GitHub schedule 兜底（其"尽力而为"延迟不可控）；回滚点：v1.0.0（含兜底版本）
  workflow_dispatch:
    branches:
      - main

jobs:
  run_script:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许自动提交并推送更新
    env:
      TZ: Asia/Shanghai
      PLAYWRIGHT_HEADLESS: "1"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 缓存Python依赖与playwright浏览器，加速后续运行
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies (适配Ubuntu 22.04+)
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends libnss3 libatk-bridge2.0-0 libdrm-dev libxkbcommon-dev libgbm-dev libatspi2.0-0 libxshmfence-dev libasound2t64 libgtk-3-0 libx11-xcb1 libxcb-dri3-0 libxrandr2 libxcursor1 libxcomposite1 libasound2-plugins libpulse0

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Python script
      run: python IPTVSCR.py

    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update live files $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        fi

    # 部署并入主流程：不再依赖 push 事件触发（push 触发偶尔会丢失，如 2026-09-08 16:46 那次）
    - name: Prepare deploy files
      run: |
        mkdir -p ./deploy
        cp ./*.txt ./deploy/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        publish_branch: gh-pages
        force_orphan: true
