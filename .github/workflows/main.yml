name: Daily Update

on:
  # 仅由 Cloudflare Worker 触发（每天北京时间 17:00 秒级调用 workflow_dispatch），也可手动触发
  # 空产出时 job 保持绿色（不发失败邮件），由 CI 反馈 Worker 后 10 分钟重触发，最多重试 2 次
  workflow_dispatch:
    branches:
      - main
    inputs:
      attempt:
        description: 重试次数标记（0=首次，1/2=Worker 重试），仅供内部使用
        required: false
        default: '0'

jobs:
  run_script:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许自动提交并推送更新
    env:
      TZ: Asia/Shanghai
      PLAYWRIGHT_HEADLESS: "1"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 缓存Python依赖与playwright浏览器，加速后续运行
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies (适配Ubuntu 22.04+)
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends libnss3 libatk-bridge2.0-0 libdrm-dev libxkbcommon-dev libgbm-dev libatspi2.0-0 libxshmfence-dev libasound2t64 libgtk-3-0 libx11-xcb1 libxcb-dri3-0 libxrandr2 libxcursor1 libxcomposite1 libasound2-plugins libpulse0

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    # 代理出口：mihomo 加载 ikuuu 订阅并强制走香港节点，
    # 规避 GitHub runner 的 Azure 数据中心 IP 被站点拉黑（本地已验证该 IP 池可访问）
    - name: Setup proxy (mihomo + ikuuu HK)
      id: proxy_step
      continue-on-error: true
      env:
        IKUUU_SUB: ${{ secrets.IKUUU_SUB }}
      run: |
        set -e
        echo "[INFO] 下载 mihomo ..."
        curl -sL -m 60 -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-linux-amd64-v1.18.10.gz"
        gunzip -f /tmp/mihomo.gz
        chmod +x /tmp/mihomo
        echo "[INFO] 拉取 ikuuu 订阅 ..."
        curl -sL -m 60 "$IKUUU_SUB" -o /tmp/sub.yaml
        pip install pyyaml -q
        mkdir -p /tmp/mihomo-config
        python scripts/mihomo_gen.py /tmp/sub.yaml /tmp/mihomo-config/config.yaml
        echo "[INFO] 启动 mihomo（HTTP 7890 / SOCKS 7891）..."
        /tmp/mihomo -d /tmp/mihomo-config -f /tmp/mihomo-config/config.yaml > /tmp/mihomo.log 2>&1 &
        sleep 10
        echo "[INFO] --- mihomo.log 尾部 ---"
        tail -n 30 /tmp/mihomo.log || true
        echo "[INFO] -------------------------"
        curl -s -m 15 -x http://127.0.0.1:7890 -o /dev/null -w "proxy check: HTTP %{http_code}\n" https://www.gstatic.com/generate_204 || echo "[WARN] 代理自检失败（脚本将直连，可能空产出）"

    # 脚本空产出时退出码 42；continue-on-error 保证 job 绿色、不发失败邮件，
    # 由下一步把结果反馈给 Worker 调度 10 分钟后的重试
    - name: Run Python script
      id: run_script
      continue-on-error: true
      env:
        SCRAPE_PROXY: http://127.0.0.1:7890
      run: python IPTVSCR.py

    # 空产出/异常反馈：脚本退出非零 → 上报 Worker → Worker 10 分钟后重新 dispatch（最多 2 次）
    - name: Report empty output to worker
      if: steps.run_script.outcome == 'failure'
      continue-on-error: true
      run: |
        echo "[WARN] 本次运行无有效产出（attempt=${{ inputs.attempt }}），上报 Worker 稍后重试"
        curl -sS -X POST -H "Content-Type: application/json" \
          -d '{"attempt":"${{ inputs.attempt }}"}' \
          "https://iptvscr-trigger.1105150696.workers.dev/result" || echo "[WARN] Worker 反馈失败（不影响本 job 状态）"

    - name: Commit and push if changed
      id: commit_step
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        if ! git diff --staged --quiet -- '*.txt'; then
          git commit -m "Auto-update live files $(date +'%Y-%m-%d %H:%M:%S')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    # 部署仅在根目录 .txt 有改动时执行：空产出不触发 pages build
    - name: Prepare deploy files
      if: steps.commit_step.outputs.changed == 'true'
      run: |
        mkdir -p ./deploy
        cp ./*.txt ./deploy/

    - name: Deploy to GitHub Pages
      if: steps.commit_step.outputs.changed == 'true'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        publish_branch: gh-pages
        force_orphan: true
